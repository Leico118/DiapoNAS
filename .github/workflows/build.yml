name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompresser le projet
        run: unzip -o DiapoNAS-source.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Cle de signature
        run: base64 -d keystore/release.b64 > app/release.jks

      - name: Compiler
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk DiapoNAS.apk

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DiapoNAS v1.0.${{ github.run_number }}
          files: DiapoNAS.apk
